# A single Rust toolchain for everyone (web, Android, CI). Go through rustup:
# `scripts/cargo.sh` does it even when ~/.cargo/bin is not in the PATH.
[toolchain]
channel = "1.97.0"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown", "aarch64-linux-android", "x86_64-linux-android"]
profile = "minimal"

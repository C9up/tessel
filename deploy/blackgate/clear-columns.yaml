# What stays in clear, and why. Every column of every table is either encrypted
# (columns.yaml) or listed here under its reason. This is the start of the metadata
# register (story 15-02), which will add the test refusing any other column.

# An identifier the database generates or compares: a ciphertext would match nothing.
key:
  - outbox.id

# A value the database sorts, compares or computes (clock, counter, state of a queue).
# It says when and how many, nothing of what is said.
queue:
  - outbox.created_at
  - outbox.available_at
  - outbox.attempts

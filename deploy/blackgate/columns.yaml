# The columns BlackGate encrypts: what the database must never keep in clear.
# Declared before the migration that creates them, then BlackGate reloads its
# configuration (scripts/stack.sh reload). The column stays `text` in the database:
# it holds the ciphertext.
#
# Randomized (deterministic: false) as long as the application does not look a value
# up by equality.
#
# Conversation content is not here: it already arrives end-to-end encrypted, the
# server never has it. BlackGate protects what the server knows (metadata).

# An event's type: what happened, without saying to whom.
"outbox.event_type":
  algorithm: "AES-256-GCM"
  deterministic: false
# What happened: an event names accounts, devices, groups.
"outbox.payload":
  algorithm: "AES-256-GCM"
  deterministic: false
# An error message can quote a value.
"outbox.last_error":
  algorithm: "AES-256-GCM"
  deterministic: false

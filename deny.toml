# cargo deny : licences, sources et avis de sécurité des dépendances Rust (ADR-005).
[graph]
all-features = true

[advisories]
# Tout avis RustSec fait échouer, y compris « non maintenu » : on décide en connaissance de cause.
version = 2
yanked = "deny"
ignore = [
  # basic-toml, non maintenu : tiré par askama pour le générateur uniffi-bindgen
  # (crates/uniffi-bindgen), qui tourne à la build et n'est jamais livré. La bibliothèque
  # livrée (tessel-ffi) n'en dépend pas. À lever quand uniffi changera de moteur.
  { id = "RUSTSEC-2026-0374", reason = "outil de build uniquement (uniffi-bindgen), jamais livré" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Les crates du dépôt se lient par chemin.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

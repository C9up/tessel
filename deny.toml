# cargo deny: licenses, sources and security advisories of Rust dependencies (ADR-005).
[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check, including "unmaintained": we decide knowingly.
version = 2
yanked = "deny"
# Each exception says why it does not affect Tessel; to review at every OpenMLS
# version bump (ADR-001). Same list in .cargo/audit.toml.
ignore = [
  # crypto-bigint 0.5 (non-constant time): only through elliptic-curve, for the NIST
  # curves (P-256, P-384, k256). Suite 0x0001 only uses X25519, Ed25519 and AES-GCM
  # (curve25519-dalek); the core creates no NIST key. Fixed in 0.7.6, out of reach as
  # long as openmls_rust_crypto stays on elliptic-curve 0.13.
  { id = "RUSTSEC-2026-0387", reason = "NIST curves only; Tessel's suite 0x0001 never handles secrets on them" },
  # proc-macro-error2 unmaintained: build-time macro of hax-lib (libcrux-sha3, via
  # hpke-rs), with no runtime code.
  { id = "RUSTSEC-2026-0173", reason = "build-time proc macro only, no runtime code" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The repository's crates link by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[package]
name = "tessel-mobile"
version = "0.1.0"
description = "The mobile binding of tessel-core (C ABI) for Ream's mobile stack: the same API as the web's, MessagePack in and out, the local database in SQLite."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# `staticlib` for the phone (ream android:* links it into the app), `rlib` for the tests.
crate-type = ["staticlib", "rlib"]

[features]
# The host on a computer, for the contract tests of @tessel/core-mobile.
contract-host = []

[[bin]]
name = "contract-host"
required-features = ["contract-host"]

[dependencies]
rmp-serde = "1.3"
serde = "1.0.229"
serde_bytes = "0.11"
tessel-api = { path = "../../../crates/tessel-api" }
tessel-core = { path = "../../../crates/tessel-core", features = ["sqlite"] }
zeroize = "1"

[lints]
workspace = true

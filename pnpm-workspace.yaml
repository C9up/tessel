packages:
  - "apps/*"
  - "packages/*"

# Isolated linker (pnpm default): Expo supports it since SDK 54, and ream-cli only
# looks for its dependencies in the app's node_modules (ream-cli bug 033).

# Native/binary postinstall steps we accept to run.
allowBuilds:
  "@swc/core": true
  esbuild: true

minimumReleaseAgeExclude:
  - '@c9up/warden@0.2.7'
  - '@c9up/atlas@0.3.24'
  - '@c9up/blackhole@0.1.28'
  - '@c9up/aurora@0.1.53'
  - '@c9up/orbit@0.1.0'
  - '@c9up/photon@0.1.25'
  - '@c9up/ream-cli-darwin-arm64@0.3.22'
  - '@c9up/ream-cli-darwin-x64@0.3.22'
  - '@c9up/ream-cli-linux-arm64@0.3.22'
  - '@c9up/ream-cli-linux-x64@0.3.22'
  - '@c9up/ream-cli-win32-x64@0.3.22'
  - '@c9up/ream-cli@0.3.22'

packages:
  - "apps/*"
  - "packages/*"

# Isolated linker (pnpm default): Expo supports it since SDK 54, and ream-cli only
# looks for its dependencies in the app's node_modules (ream-cli bug 033).

# Native/binary postinstall steps we accept to run.
allowBuilds:
  "@swc/core": true
  esbuild: true

minimumReleaseAgeExclude:
  - '@c9up/warden@0.2.7'

# Tessel's development infrastructure, apart from the database.
# Postgres and BlackGate are started by scripts/stack.sh (mutual TLS, as in production).
# KeyDB: outbox guard, rate limiting, broadcast between instances.
services:
  keydb:
    image: docker.io/eqalpha/keydb:latest
    container_name: tessel-keydb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6460}:6379"
    volumes:
      - keydbdata:/data
    healthcheck:
      test: ["CMD", "keydb-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  keydbdata:

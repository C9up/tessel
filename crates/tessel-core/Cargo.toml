[package]
name = "tessel-core"
version = "0.1.0"
description = "Cœur client de Tessel : MLS, base locale chiffrée, file d'envoi, chiffrement des médias."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
# Épinglés (ADR-001) : OpenMLS est en 0.x, chaque montée de version est une story.
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
thiserror = "2"
tls_codec = { version = "0.5", features = ["derive"] }
zeroize = "1"

# Dans le navigateur, l'aléa et l'horloge viennent de l'API Web (`crypto.getRandomValues`).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
openmls = { version = "=0.9.2", features = ["js"] }
# `rand_core` 0.6 (RustCrypto, via hpke-rs) tire encore getrandom 0.2, qui exige
# sa propre fonctionnalité `js` sur cette cible. Rien ne l'appelle d'ici.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[lints]
workspace = true

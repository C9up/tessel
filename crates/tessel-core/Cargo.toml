[package]
name = "tessel-core"
version = "0.1.0"
description = "Tessel client core: MLS, encrypted local database, send queue, media encryption."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
# Pinned (ADR-001): OpenMLS is 0.x, every version bump is a story.
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
thiserror = "2"
tls_codec = { version = "0.5", features = ["derive"] }
zeroize = "1"

# In the browser, randomness and the clock come from the Web API (`crypto.getRandomValues`).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
openmls = { version = "=0.9.2", features = ["js"] }
# `rand_core` 0.6 (RustCrypto, via hpke-rs) still pulls in getrandom 0.2, which needs
# its own `js` feature on this target. Nothing calls it from here.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[lints]
workspace = true

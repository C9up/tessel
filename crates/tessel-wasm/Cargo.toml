[package]
name = "tessel-wasm"
version = "0.1.0"
description = "WASM bindings of tessel-core (wasm-bindgen) for the web client."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned with wasm-bindgen: a newer js-sys requires a newer wasm-bindgen.
js-sys = "=0.3.106"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_bytes = "0.11"
tessel-core = { path = "../tessel-core" }
# Pinned: the crate version must match the `wasm-bindgen` CLI that produces the JS.
wasm-bindgen = "=0.2.129"

# No `[lints] workspace = true`: `#[wasm_bindgen]` generates `unsafe` code.
[lints.clippy]
all = { level = "deny", priority = -1 }

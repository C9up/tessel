[package]
name = "tessel-wasm"
version = "0.1.0"
description = "Liaisons WASM de tessel-core (wasm-bindgen) pour le client web."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tessel-core = { path = "../tessel-core" }
# Épinglé : la version du crate doit être celle du CLI `wasm-bindgen` qui produit le JS.
wasm-bindgen = "=0.2.129"

# Pas de `[lints] workspace = true` : `#[wasm_bindgen]` engendre du code `unsafe`.
[lints.clippy]
all = { level = "deny", priority = -1 }
